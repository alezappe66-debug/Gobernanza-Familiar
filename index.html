<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alejandro Zappe — Gobernanza Familiar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1814;
    --ink-mid: #4a4640;
    --ink-light: #8a857e;
    --cream: #ebebeb;
    --cream-dark: #e0e0e0;
    --gold: #9a7c3f;
    --gold-light: #c4a96a;
    --border: rgba(26,24,20,0.12);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 18px;
    line-height: 1.7;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--cream);
    border-bottom: 0.5px solid var(--border);
    padding: 1rem 3rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink);
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    font-family: 'EB Garamond', serif;
    font-size: 15px; letter-spacing: 0.06em;
    color: var(--ink-mid); text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold); }
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 8rem 3rem 5rem;
    max-width: 860px; margin: 0 auto;
  }
  .hero-eyebrow {
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 2rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .hero-eyebrow::after {
    content: ''; display: block; width: 48px; height: 0.5px; background: var(--gold);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 400; line-height: 1.15;
    color: var(--ink); margin-bottom: 2rem;
    max-width: 720px;
  }
  h1 em { font-style: italic; color: var(--gold); }
  .hero-sub {
    font-size: 1.1rem; color: var(--ink-mid);
    max-width: 520px; margin-bottom: 3rem;
    font-style: italic;
  }
  .btn-primary {
    display: inline-block;
    padding: 0.85rem 2.5rem;
    background: var(--ink);
    color: var(--cream);
    font-family: 'EB Garamond', serif;
    font-size: 15px; letter-spacing: 0.1em;
    text-decoration: none; text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--gold); }
  .divider {
    width: 100%; max-width: 860px; margin: 0 auto;
    height: 0.5px; background: var(--border);
  }
  section { padding: 6rem 3rem; max-width: 860px; margin: 0 auto; }
  .section-label {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold-light); margin-bottom: 3rem;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 400; line-height: 1.2;
    margin-bottom: 1.5rem; color: var(--ink);
  }
  .problema-text {
    font-size: 1.25rem; line-height: 1.8;
    color: var(--ink-mid); max-width: 640px;
    border-left: 2px solid var(--gold);
    padding-left: 2rem;
    font-style: italic;
  }
  .servicios-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2px; margin-top: 3rem;
    border: 0.5px solid var(--border);
  }
  .servicio-card {
    padding: 2.5rem 2rem;
    background: var(--cream);
    border: 0.5px solid var(--border);
    transition: background 0.2s;
  }
  .servicio-card:hover { background: var(--cream-dark); }
  .servicio-num {
    font-size: 11px; letter-spacing: 0.2em; color: var(--gold-light);
    margin-bottom: 1.2rem; display: block;
  }
  .servicio-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 500;
    margin-bottom: 0.8rem; line-height: 1.3;
  }
  .servicio-card p { font-size: 0.95rem; color: var(--ink-mid); line-height: 1.65; }
  .tray-nums { display: flex; gap: 4rem; margin: 3rem 0; flex-wrap: wrap; }
  .tray-num { flex: 1; min-width: 140px; }
  .tray-num .big {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem; font-weight: 400; color: var(--ink); line-height: 1;
  }
  .tray-num .big span { font-size: 2rem; color: var(--gold); }
  .tray-num .label { font-size: 13px; letter-spacing: 0.06em; color: var(--ink-light); margin-top: 0.4rem; }
  .empresas { display: flex; flex-wrap: wrap; border-top: 0.5px solid var(--border); margin-top: 3rem; }
  .empresa {
    padding: 1.2rem 2rem;
    border-right: 0.5px solid var(--border);
    border-bottom: 0.5px solid var(--border);
    font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-mid);
  }
  .carrusel-wrap {
    overflow: hidden;
    padding: 2.5rem 0;
    border-top: 0.5px solid var(--border);
    border-bottom: 0.5px solid var(--border);
  }
  .carrusel-track {
    display: flex; gap: 3rem;
    width: max-content;
    animation: scroll-logos 50s linear infinite;
  }
  .carrusel-track:hover { animation-play-state: paused; }
  .carrusel-item {
    font-family: 'Playfair Display', serif;
    font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-light);
    white-space: nowrap; padding: 0 1rem;
  }
  @keyframes scroll-logos {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .articulos-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2px; margin-top: 3rem;
  }
  .articulo-card {
    padding: 2.5rem 2rem; background: var(--cream);
    border: 0.5px solid var(--border);
    text-decoration: none; color: var(--ink);
    display: flex; flex-direction: column; transition: background 0.2s;
  }
  .articulo-card:hover { background: var(--cream-dark); }
  .articulo-card:hover .articulo-arrow { color: var(--gold); }
  .articulo-fecha {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold-light); margin-bottom: 1rem;
  }
  .articulo-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem; font-weight: 400; line-height: 1.35;
    margin-bottom: 1rem; color: var(--ink);
  }
  .articulo-resumen {
    font-size: 0.92rem; color: var(--ink-mid);
    line-height: 1.65; flex: 1; font-style: italic;
  }
  .articulo-footer {
    margin-top: 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 0.5px solid var(--border); padding-top: 1rem;
  }
  .articulo-source {
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-light);
  }
  .articulo-arrow { font-size: 1.2rem; color: var(--ink-light); transition: color 0.2s; }
  .contact-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: start; }
  .contact-link {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem 0; border-bottom: 0.5px solid var(--border);
    text-decoration: none; color: var(--ink); font-size: 0.95rem; transition: color 0.2s;
  }
  .contact-link:hover { color: var(--gold); }
  .contact-link .cl-label {
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--ink-light); min-width: 80px;
  }
  footer {
    border-top: 0.5px solid var(--border); padding: 2rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--ink-light); letter-spacing: 0.05em;
  }
  footer span { font-family: 'Playfair Display', serif; }
  @media (max-width: 640px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    section, .hero { padding-left: 1.5rem; padding-right: 1.5rem; }
    .contact-wrap { grid-template-columns: 1fr; gap: 3rem; }
    .tray-nums { gap: 2rem; }
    footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">Alejandro Zappe</a>
  <ul class="nav-links">
